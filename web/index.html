<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بصيرة | معرفة موثوقة .. بهداية واضحة</title>
<script>
  // theme before first paint: saved choice, else the system setting
  (function () { try { var t = localStorage.getItem('bs-theme'); if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t); } catch (e) {} })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&family=Reem+Kufi:wght@500;700&family=Amiri:wght@400;700&family=Amiri+Quran&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#faf8f3; --card:#fff; --side:#f6f6f2; --field:#fbfbf8; --soft:#f4f7f4;
  --green:#2f6b57; --green-d:#1f4f40; --green-l:#e6efe9; --on-green:#fff;
  --gold:#b8975a; --gold-l:#fbf3df; --gold-t:#7a5b10;
  --text:#1d3b33; --sub:#6b7470; --muted:#8b9490; --line:#e6e9e4;
  --verify-bg:#eef4ef; --verify-line:#dbe6df; --tools-bg:#fbf9f3;
  --arch1:#efe9d9; --arch2:#f3eee0; --shadow:0 6px 24px rgba(40,60,50,.08);
  --ok:#2e7d32; --ok-bg:#eaf6ec; --warn:#a86a12; --warn-bg:#fff6e6; --bad:#b3261e; --bad-bg:#fdecea; --na:#6b7280; --na-bg:#f1f2f4;
  --quran-bg:#f3f8f5; --hadith-bg:#fffaf0; --tafsir-bg:#f5f7f6; --glos-bg:#f7f4fa; --glos:#6f4f86;
  --mosque:#c6d0cb; --logo-ink:#1f4f40; --logo-sub:#56625c; --em-gold:#c3a066; --em-g1:#2f6b57; --em-g2:#1f4f40; --em-vein:#6f9a86; --hc-g1:#5a8c79; --hc-g2:#6c9884; --hc-g3:#8fa676; --hc-arch1:#fdfbf5; --hc-arch2:#f9f7f1;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0f1715; --card:#16211e; --side:#121c19; --field:#111a17; --soft:#1a2723;
    --green:#3f8a70; --green-d:#a9d6c3; --green-l:#1d2e28; --on-green:#fff;
    --gold:#c9a866; --gold-l:#2b2516; --gold-t:#e3c98d;
    --text:#e3ebe7; --sub:#a7b4ae; --muted:#8b9a94; --line:#26332f;
    --verify-bg:#13201c; --verify-line:#24352f; --tools-bg:#131d1a;
    --arch1:#1d2925; --arch2:#1a2522; --shadow:0 6px 24px rgba(0,0,0,.35);
    --ok:#6fcf86; --ok-bg:#15291b; --warn:#e6b25c; --warn-bg:#2a2214; --bad:#f08a80; --bad-bg:#2e1715; --na:#a3abb8; --na-bg:#1c2226;
    --quran-bg:#14231e; --hadith-bg:#221e14; --tafsir-bg:#18201e; --glos-bg:#1f1a26; --glos:#c7a8de;
    --mosque:#2c3c36; --logo-ink:#e2ece7; --logo-sub:#a7b4ae; --em-gold:#d4b273; --em-g1:#4c9a7c; --em-g2:#357a62; --em-vein:#8cc2ab; --hc-g1:#1f3b32; --hc-g2:#264a3e; --hc-g3:#3a5236; --hc-arch1:#18241f; --hc-arch2:#16211e;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0f1715; --card:#16211e; --side:#121c19; --field:#111a17; --soft:#1a2723;
  --green:#3f8a70; --green-d:#a9d6c3; --green-l:#1d2e28; --on-green:#fff;
  --gold:#c9a866; --gold-l:#2b2516; --gold-t:#e3c98d;
  --text:#e3ebe7; --sub:#a7b4ae; --muted:#8b9a94; --line:#26332f;
  --verify-bg:#13201c; --verify-line:#24352f; --tools-bg:#131d1a;
  --arch1:#1d2925; --arch2:#1a2522; --shadow:0 6px 24px rgba(0,0,0,.35);
  --ok:#6fcf86; --ok-bg:#15291b; --warn:#e6b25c; --warn-bg:#2a2214; --bad:#f08a80; --bad-bg:#2e1715; --na:#a3abb8; --na-bg:#1c2226;
  --quran-bg:#14231e; --hadith-bg:#221e14; --tafsir-bg:#18201e; --glos-bg:#1f1a26; --glos:#c7a8de;
  --mosque:#2c3c36; --logo-ink:#e2ece7; --logo-sub:#a7b4ae; --em-gold:#d4b273; --em-g1:#4c9a7c; --em-g2:#357a62; --em-vein:#8cc2ab; --hc-g1:#1f3b32; --hc-g2:#264a3e; --hc-g3:#3a5236; --hc-arch1:#18241f; --hc-arch2:#16211e;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:'Tajawal',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.7;transition:background .2s,color .2s}
html[dir=ltr] body{font-family:'Tajawal',system-ui,'Segoe UI',Arial,sans-serif}
a{color:var(--green)}
:root[data-theme="dark"] a{color:var(--green-d)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) a{color:var(--green-d)}}
button{font:inherit;color:inherit}
.saw{font-family:'Amiri','Amiri Quran','Noto Naskh Arabic','Scheherazade New','Traditional Arabic','Times New Roman',serif;font-weight:400}
.ic{width:24px;height:24px;stroke:var(--green-d);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}

.app{display:grid;grid-template-columns:minmax(0,1fr) 310px;min-height:100vh;direction:ltr}
.app>*{direction:rtl}
html[dir=ltr] .app>*{direction:ltr}

/* ---------- sidebar ---------- */
.sidebar{background:var(--side);padding:22px 20px 24px;display:flex;flex-direction:column;position:fixed;top:0;bottom:0;width:290px;max-width:86vw;overflow-y:auto;z-index:50;box-shadow:0 0 40px rgba(0,0,0,.18);transition:transform .25s ease,visibility .25s}
html[dir=rtl] .sidebar,html[dir=ltr] .sidebar{left:0;right:auto;transform:translateX(-105%)}
.sidebar{visibility:hidden} body.menu-open .sidebar{transform:none;visibility:visible}
.scrim{position:fixed;inset:0;background:rgba(10,20,16,.42);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
body.menu-open .scrim{opacity:1;pointer-events:auto} body.menu-open{overflow:hidden}
.side-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:34px}
.close{width:36px;height:36px;border:1px solid var(--line);background:var(--card);border-radius:50%;display:grid;place-items:center;cursor:pointer}
.close svg,.menu svg{width:18px;height:18px;stroke:var(--green-d);fill:none;stroke-width:2;stroke-linecap:round}
.menu{width:36px;height:36px;border:1px solid var(--line);background:var(--card);border-radius:18px;display:grid;place-items:center;cursor:pointer}
.menu svg{width:18px;height:18px}.menu:hover,.close:hover{background:var(--green-l)}
.side-art{position:absolute;left:0;right:0;top:150px;bottom:86px;z-index:0;pointer-events:none}
.user{display:flex;align-items:center;gap:12px}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--green);display:grid;place-items:center;flex:none}
.hello{font-size:15px}
nav{position:relative;z-index:1}
nav button{width:100%;display:flex;align-items:center;gap:14px;padding:13px 16px;border:0;border-radius:10px;background:transparent;color:var(--text);font-size:15px;margin-bottom:6px;cursor:pointer;text-align:start}
nav button:hover{background:var(--soft)}
nav button[aria-current=page]{background:var(--green-l);font-weight:500}
.skyline{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;color:var(--mosque)}
.side-verse{margin-top:auto;position:relative;z-index:1;text-align:center;color:var(--green-d);padding:8px 12px 0}
.side-verse .ayah-s{font-family:'Amiri Quran','Amiri','Noto Naskh Arabic','Scheherazade New','Traditional Arabic','Times New Roman',serif;font-size:19px;direction:rtl}
.side-verse small{display:block;color:var(--muted);margin-top:4px;font-size:12px}

/* ---------- main ---------- */
main{position:relative;padding:28px 48px 40px;display:flex;flex-direction:column;align-items:center;min-width:0}
.toolbar{align-self:stretch;display:flex;align-items:center;gap:8px;position:relative;z-index:2}
.pill{height:36px;min-width:36px;padding:0 12px;border:1px solid var(--line);background:var(--card);border-radius:18px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:14px;color:var(--text)}
.pill:hover{background:var(--green-l)}
.pill svg{width:18px;height:18px;stroke:var(--green-d);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.view{width:100%;display:flex;flex-direction:column;align-items:center}
.view[hidden]{display:none}
.hero{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;width:100%}
.arch{position:absolute;top:-24px;left:50%;transform:translateX(-50%);width:520px;max-width:100%;height:330px;pointer-events:none}
.arch path:first-child{stroke:var(--arch1)} .arch path:last-child{stroke:var(--arch2)}
h1{font-family:'Reem Kufi','Tajawal',sans-serif;font-size:44px;font-weight:700;color:var(--green-d);margin-top:58px;position:relative;line-height:1.3}
.divider{display:flex;align-items:center;gap:6px;margin:6px 0 16px;position:relative}
.divider b{width:34px;height:1px;background:var(--gold)}
.divider i{width:7px;height:7px;border-radius:50%;background:var(--gold)}
.sub{font-size:19px;color:var(--sub);margin-bottom:34px;position:relative}
.panel{width:100%;max-width:845px;background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:26px 30px;position:relative;border:1px solid transparent}
:root[data-theme="dark"] .panel,:root[data-theme="dark"] .verify{border-color:var(--line)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .panel,:root:not([data-theme="light"]) .verify{border-color:var(--line)}}
.panel h3,.verify h3{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:700;margin-bottom:16px}
.row{display:flex;gap:14px;align-items:center}
.input{flex:1;min-width:0;height:66px;border:1px solid var(--line);background:var(--field);border-radius:12px;padding:0 22px;font:inherit;font-size:16px;color:var(--text);outline:none}
.input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(47,107,87,.18)}
.send{width:52px;height:52px;border:0;border-radius:10px;background:var(--green);cursor:pointer;display:grid;place-items:center;flex:none}
.send svg{width:22px;height:22px;stroke:var(--on-green);fill:none;stroke-width:1.8;stroke-linejoin:round}
html[dir=rtl] .send svg{transform:scaleX(-1)}
.send:disabled,.btn:disabled{opacity:.6;cursor:wait}
.mic{width:52px;height:52px;border-radius:10px;border:1px solid var(--green);background:var(--field,var(--green-l));color:var(--green);cursor:pointer;display:grid;place-items:center;flex:none;margin-bottom:7px;font-size:1.2rem}
.mic[hidden],.composer[data-mode=verify] .mic{display:none}
.mic.rec{background:var(--bad);color:#fff;border-color:var(--bad);animation:micpulse 1.2s ease-in-out infinite}
.mic:disabled{opacity:.5;cursor:wait}
@keyframes micpulse{50%{box-shadow:0 0 0 8px rgba(179,38,30,.18)}}
.chips{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--soft);border-radius:22px;padding:8px 16px;font-size:14px;color:var(--text);cursor:pointer}
.chip.label{background:transparent;border-color:transparent;padding-inline:0;cursor:default;color:var(--sub)}
.chip:not(.label):hover{background:var(--green-l)}
.verify{margin-top:24px}
.vinput{display:block;resize:none;padding:20px 22px;line-height:1.6;max-height:240px;overflow-y:auto}
.vinput::placeholder{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.verify .row{align-items:center}
.btn{background:var(--green);color:var(--on-green);border:0;border-radius:10px;padding:0 28px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;flex:none}
.btn svg{width:20px;height:20px;stroke:var(--on-green);fill:none;stroke-width:2}
.verify .chips{margin-top:12px}
.disclosure{width:100%;max-width:845px;margin-top:14px;font-size:13px;color:var(--sub);display:flex;gap:8px;align-items:flex-start}
.disclosure .ic{width:18px;height:18px;stroke:var(--gold);margin-top:3px}
.features[hidden]{display:none}
.features{margin-top:30px;width:100%;max-width:845px;display:grid;grid-template-columns:repeat(4,1fr)}
.feat{text-align:center;padding:6px 14px;border-inline-start:1px solid var(--line)}
.feat:first-child{border-inline-start:0}
.feat .ic{width:36px;height:36px;stroke-width:1.5;margin:0 auto 10px;display:block}
.feat b{display:block;font-size:15px;margin-bottom:4px}
.feat span{font-size:12.5px;color:var(--muted)}

/* ---------- results ---------- */
#out{width:100%;max-width:845px;margin-top:24px;scroll-margin-top:16px}
#out:empty{display:none}
.res-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
.res-head .q{font-weight:700;font-size:17px;color:var(--green-d)}
.res-head .pill{flex:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin:12px 0;border-inline-start:5px solid var(--green);box-shadow:0 2px 10px rgba(40,60,50,.04)}
.card .kind{font-size:13px;font-weight:700;color:var(--green-d);margin-bottom:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card.gen{border-inline-start-color:var(--green-d)}
.card.quran{border-inline-start-color:var(--green);background:var(--quran-bg)}
.card.hadith{border-inline-start-color:var(--gold);background:var(--hadith-bg)} .card.hadith .kind{color:var(--gold-t)}
.card.tafsir{border-inline-start-color:var(--muted);background:var(--tafsir-bg)} .card.tafsir .kind{color:var(--sub)}
.card.corr{border-inline-start-color:var(--warn);background:var(--warn-bg)} .card.corr .kind{color:var(--warn)}
.card.glos{border-inline-start-color:var(--glos);background:var(--glos-bg)} .card.glos .kind{color:var(--glos)}
.card.note{border-inline-start-color:var(--gold)}
.ayah{font-family:'Amiri Quran','Amiri','Noto Naskh Arabic','Scheherazade New','Traditional Arabic','Times New Roman',serif;font-size:1.55rem;line-height:2.3;margin:4px 0;direction:rtl;text-align:right;color:var(--text)}
.htext{font-size:1.12rem;direction:rtl;text-align:right;line-height:2}
.htext.big{font-family:'Amiri','Amiri Quran','Noto Naskh Arabic','Scheherazade New','Traditional Arabic','Times New Roman',serif;font-size:1.5rem;line-height:2.2}
.en{direction:ltr;text-align:left;color:var(--sub);font-size:.95rem;margin-top:4px}
.meta{font-size:13px;color:var(--muted);margin-top:6px}
.badge{display:inline-block;padding:1px 10px;border-radius:12px;font-size:12px;margin-inline-end:6px;background:var(--green-l);color:var(--green-d);font-weight:500}
.badge.grade{background:var(--gold-l);color:var(--gold-t)}
sup a{text-decoration:none;font-weight:700;padding:0 1px}
.status{border-radius:12px;padding:12px 16px;margin:12px 0;font-size:15px;border:1px solid var(--line)}
.status.abst{background:var(--na-bg)} .status.ref{background:var(--green-l)} .status.warn{background:var(--warn-bg);border-color:transparent}
.src{font-size:14px;padding:6px 0;border-top:1px dashed var(--line)} .src:first-of-type{border-top:0}
.src b{color:var(--green-d)}
.links{list-style:none} .links li{margin:4px 0}
.claimtxt{background:var(--soft);border-radius:10px;padding:8px 12px;font-size:1.05rem;direction:rtl;text-align:right;margin-top:4px}
.correctbox{background:var(--hadith-bg);border:1px solid var(--line);border-inline-start:5px solid var(--gold);border-radius:12px;padding:10px 14px;margin:12px 0}
.diff .rep{background:var(--bad-bg);text-decoration:line-through;color:var(--bad);border-radius:4px;padding:0 3px}
.diff .cor,.diff .miss{background:var(--ok-bg);color:var(--ok);font-weight:700;border-radius:4px;padding:0 3px}
.diff .miss{text-decoration:underline}
.res{border-inline-start-width:7px}
.res.green{border-inline-start-color:var(--ok)} .res.amber{border-inline-start-color:var(--warn)} .res.red{border-inline-start-color:var(--bad)} .res.grey{border-inline-start-color:var(--na)}
.verdict{font-weight:700;font-size:16px;margin-bottom:6px}
.green .verdict{color:var(--ok)} .amber .verdict{color:var(--warn)} .red .verdict{color:var(--bad)} .grey .verdict{color:var(--na)}
.label{font-size:13px;color:var(--sub);margin-top:8px;display:block}
.tbl{width:100%;overflow-x:auto;margin-top:8px}
table.m{width:100%;border-collapse:collapse;font-size:13px} table.m td,table.m th{border-top:1px solid var(--line);padding:6px;text-align:start;vertical-align:top} table.m th{color:var(--sub);font-weight:500}
.loading{text-align:center;color:var(--sub);padding:26px 0}
.spin{display:inline-block;width:20px;height:20px;border:3px solid var(--green-l);border-top-color:var(--green);border-radius:50%;animation:sp 1s linear infinite;vertical-align:middle;margin-inline-end:10px}
@keyframes sp{to{transform:rotate(360deg)}}
.audio-btn{margin-top:8px;border:1px solid var(--line);background:var(--card);border-radius:18px;padding:4px 14px;cursor:pointer;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.audio-btn:hover{background:var(--green-l)}
audio{width:100%;max-width:380px;height:34px;margin-top:6px}
.reportbox{margin:16px 0;border:1px dashed var(--line);border-radius:12px;padding:10px 14px;background:var(--card);font-size:14px}
.reportbox summary{cursor:pointer;color:var(--green-d)}
.reportbox select,.reportbox textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:var(--field);color:var(--text);margin-top:4px}
.consent{display:flex;gap:8px;align-items:flex-start;margin:10px 0;font-size:13px;color:var(--sub)}
.consent input{margin-top:5px;accent-color:var(--green)}
.small-btn{background:var(--green);color:var(--on-green);border:0;border-radius:10px;padding:8px 20px;cursor:pointer}
.small-btn:disabled{opacity:.5;cursor:not-allowed}

/* ---------- secondary views ---------- */
.page{width:100%;max-width:845px;margin-top:20px}
.page h2{font-family:'Reem Kufi','Tajawal',sans-serif;font-size:30px;color:var(--green-d);margin-bottom:4px}
.page .lead{color:var(--sub);margin-bottom:18px}
.list-item{display:flex;gap:14px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin-bottom:10px;width:100%;text-align:start;cursor:pointer}
.list-item:hover{background:var(--green-l)}
.list-item .when{font-size:12px;color:var(--muted)}
.list-item .qq{font-weight:500}
.empty{color:var(--sub);background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:24px;text-align:center}
.src-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin-bottom:10px}
.src-card b{color:var(--green-d)}
.rules{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:14px 0}
.rule{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;border-top:3px solid var(--gold)}
.rule b{display:block;color:var(--green-d);margin-bottom:4px}


/* ---------- header bar ---------- */
.topbar{grid-column:1/-1;position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:flex-start;direction:ltr!important;gap:16px;padding:10px 32px;background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar .toolbar{align-self:center;flex:none;direction:ltr}
html[dir=rtl] .topbar .pill{direction:rtl}
.topbar .pill{white-space:nowrap}
#lang{min-width:84px}
.app{grid-template-rows:auto 1fr auto}


/* ---------- collapsible side panel ---------- */
.app{overflow-x:clip;transition:grid-template-columns .35s ease}
aside{transition:padding .35s ease}
aside>*{transition:transform .35s ease,opacity .25s ease}
.side-panel{width:100%}
.hadith-card{position:relative}
.hc-toggle{position:absolute;top:12px;left:12px;z-index:2;width:32px;height:32px;border-radius:50%;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.18);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);color:#fff;display:grid;place-items:center;cursor:pointer}
.hc-toggle:hover{background:rgba(255,255,255,.32)}
.hc-toggle svg,.side-tab svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.side-tab{position:fixed;right:0;top:50%;transform:translate(110%,-50%);z-index:20;display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 8px;border:0;border-radius:14px 0 0 14px;background:linear-gradient(160deg,var(--hc-g1),var(--hc-g2));color:#fff;cursor:pointer;box-shadow:var(--shadow);transition:transform .35s ease;font:inherit;font-size:13px;font-weight:600}
.side-tab span{writing-mode:vertical-rl}
.side-tab:hover{filter:brightness(1.08)}
.tb-logo{display:none;height:46px;width:auto;margin-left:auto;max-width:none}
@media (min-width:1001px){
  .app.side-off{grid-template-columns:minmax(0,1fr) 0px}
  .app.side-off aside{padding:0;overflow:hidden;max-height:0;transition:padding .35s ease,max-height 0s linear .35s}
  .app.side-off aside>*{transform:translateX(115%);opacity:0;pointer-events:none}
  .app.side-off .side-tab{transform:translate(0,-50%)}
  .app.side-off .tb-logo{display:block}
  .app.side-off :is(.panel,.disclosure,.features,#out,.page){max-width:1040px}
  :is(.panel,.disclosure,.features,#out,.page){transition:max-width .35s ease}
}
@media (max-width:1000px){ .hc-toggle,.side-tab{display:none} }


/* ---------- font size ---------- */
main,aside,.sidebar,footer.credit{zoom:var(--fz,1)}
.fz{display:inline-flex;height:36px;border:1px solid var(--line);background:var(--card);border-radius:18px;overflow:hidden;flex:none;direction:ltr}
.fz button{border:0;background:transparent;color:var(--green-d);font:inherit;font-weight:700;padding:0 11px;cursor:pointer;display:inline-flex;align-items:center;line-height:1}
.fz button sup{font-size:.72em;margin-left:1px;vertical-align:0;position:relative;top:-.35em}
#fzDown{font-size:13px}#fzUp{font-size:17px;border-left:1px solid var(--line)}
.fz button:hover:not(:disabled){background:var(--green-l)}
.fz button:disabled{opacity:.35;cursor:default}


/* ---------- unified composer ---------- */
.ctabs{display:inline-flex;gap:4px;padding:4px;background:var(--soft);border:1px solid var(--line);border-radius:14px;margin-bottom:16px}
.ctab{display:inline-flex;align-items:center;gap:8px;border:0;background:transparent;color:var(--sub);font:inherit;font-size:16px;font-weight:700;padding:8px 16px;border-radius:10px;cursor:pointer}
.ctab .ic{width:22px;height:22px;stroke:var(--sub)}
.ctab[aria-selected=true]{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.ctab[aria-selected=true] .ic{stroke:var(--green-d)}
.ctab[data-mode=verify][aria-selected=true] .ic{stroke:var(--gold)}
.ctab:hover:not([aria-selected=true]){color:var(--text)}
.composer .row{align-items:flex-end}
.composer .send{margin-bottom:7px}
.vinput{overflow-y:hidden}
.chint{margin-top:10px;font-size:13px;color:var(--sub)}
.composer .i-ver{display:none}
.composer[data-mode=verify] .i-ver{display:block}.composer[data-mode=verify] .i-ask{display:none}
html[dir=rtl] .send .i-ver{transform:none}
@media (max-width:420px){.composer .send{margin-bottom:4px}.ctab{font-size:14px;padding:8px 10px}.ctabs{display:flex}.ctab{flex:1;justify-content:center}}

/* ---------- aside ---------- */
aside{padding:28px 18px 28px 26px;display:flex;flex-direction:column;align-items:stretch}
.logo{width:272px;max-width:100%;height:auto;display:block;margin:0 0 30px}
.hadith-card{width:100%;border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;background:linear-gradient(180deg,var(--hc-arch2),var(--tools-bg));overflow:hidden;text-align:center;color:var(--text)}
.hhead{display:block;width:100%;height:auto}
.hadith-card .txt{padding:6px 18px 22px;font-size:15px;line-height:2}
.hadith-card small{display:block;font-size:12px;color:var(--muted);margin-top:4px}
.tools{width:100%;background:var(--tools-bg);border:1px solid var(--line);border-top:0;border-radius:0 0 20px 20px;padding:0 20px 26px}
.tools h4{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:700;margin-bottom:18px;border-top:1px solid var(--line);padding-top:22px}
.tool{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:13px 16px;font-size:14px;margin-bottom:10px;cursor:pointer;color:var(--text);width:100%;text-align:start}
.tool:hover{background:var(--green-l)}
.tool .ic{width:22px;height:22px}
.tool .chev{margin-inline-start:auto;width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2;transition:transform .2s}
.tool[aria-expanded=true]{background:var(--green-l);border-color:var(--green-l);margin-bottom:0;border-radius:10px 10px 0 0}
.tool[aria-expanded=true] .chev{transform:rotate(180deg)}
.tool-list{background:var(--card);border:1px solid var(--green-l);border-top:0;border-radius:0 0 10px 10px;padding:6px;margin-bottom:10px}
.tool-list[hidden]{display:none}
.tool-q{display:flex;gap:9px;align-items:baseline;width:100%;text-align:start;border:0;background:transparent;border-radius:8px;padding:9px 12px;font-size:13.5px;color:var(--text);cursor:pointer;line-height:1.5}
.tool-q:hover{background:var(--soft);color:var(--green-d)}
.tool-q::before{content:'';display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--gold);flex:none;transform:translateY(-2px)}

footer.credit{grid-column:1/-1;direction:rtl;text-align:center;color:var(--muted);font-size:12px;padding:14px 16px 22px;border-top:1px solid var(--line)}
html[dir=ltr] footer.credit{direction:ltr}

@media (max-width:1180px){ .app{grid-template-columns:minmax(0,1fr) 280px} main{padding:24px 28px 40px} }
@media (max-width:1000px){
  .app{grid-template-columns:1fr}
  main{padding:16px 16px 32px}
  h1{font-size:34px;margin-top:40px}
  .sub{font-size:16px;margin-bottom:24px}
  .panel,.verify{padding:20px 16px}
  .btn{height:48px}
  .features{grid-template-columns:repeat(2,1fr);row-gap:20px}
  .feat:nth-child(3){border-inline-start:0}
  aside{padding:8px 16px 28px;max-width:520px;width:100%;margin:0 auto}
  .logo{margin:0 auto 20px}
  .topbar{padding:8px 16px}
  .rules{grid-template-columns:1fr}
}
@media (max-width:480px){ #theme span{display:none} #theme{width:36px;padding:0} }
@media (max-width:420px){ .input{height:56px;padding:0 14px} .input.vinput{padding:15px 14px} .send{width:48px;height:48px} h1{font-size:30px} .ayah{font-size:1.35rem} }
</style>

const HISTORY = [];
function renderHistory() {
  const box = $('#historyList'); if (!box) return;
  if (!HISTORY.length) { box.innerHTML = `<div class="empty">${esc(T().historyEmpty)}</div>`; return; }

    <span><span class="qq">${esc(h.text.length > 140 ? h.text.slice(0, 140) + '…' : h.text)}</span><br><span class="when">${esc(h.time)}</span></span></button>`).reverse().join('');
  box.querySelectorAll('[data-h]').forEach(b => b.onclick = () => {
    const h = HISTORY[+b.dataset.h]; showView('home');
    $('#out').innerHTML = h.html; lastCtx = h.ctx; wireReport(); hideFeatures(true);
    $('#out').scrollIntoView({ behavior: 'smooth' });
  });
}

const loading = (msg) => `<div class="loading" id="loadmsg"><span class="spin"></span><span id="loadtxt">${esc(msg || T().loading)}</span></div>`;
function withCites(t) { return esc(t).replace(/\[(\d+)\]/g, (m, n) => `<sup><a href="#src-${n}">[${n}]</a></sup>`).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>'); }
function diffHtml(diff) {
  return (diff || []).map(d => d.op === 'equal' ? `<span>${esc(d.text)}</span>`

    : d.op === 'extra' ? `<span class="rep">${esc(d.claimed)}</span>` : `<span class="miss">${esc(d.correct)}</span>`).join(' ');
}
const SPEAKER = '<svg class="ic" style="width:16px;height:16px" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9zM16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg>';

      <div class="meta"><span class="badge grade">${esc(t.grade)}: ${esc(b.grade)}</span>${esc(b.attribution || '')} — ${esc(b.grade_source)} · ${link(b.reference_url, '↗')}</div></div>`;
  if (b.kind === 'tafsir') return `<div class="card tafsir"><div class="kind">${esc(t.tafsir)} (${esc(b.ref)})</div><div class="htext">${esc(b.text_ar)}</div><div class="meta">${esc(b.work || '')} · ${link(b.reference_url, '↗')}</div></div>`;
  if (b.kind === 'glossary') return `<div class="card glos"><div class="kind">${esc(t.glossary)}</div><div><b>${esc(b.term_ar)}</b> = <b dir="ltr">${esc(b.term_en)}</b></div><div class="meta">${esc(b.usage_note_ar)}</div></div>`;
  if (b.kind === 'verse_correction') return `<div class="card corr"><div class="kind">${esc(t.corr)}</div><div>${esc(b.message)}</div>
      ${b.text_ar ? `<div class="ayah">﴿${esc(b.text_ar)}﴾</div><div class="meta">${esc(b.surah_name_ar)} ${esc(b.ref)} · ${link(b.reference_url, '↗')}</div><div class="diff claimtxt">${diffHtml(b.diff)}</div>` : ''}</div>`;
  if (b.kind === 'general_info') return `<div class="card"><div class="kind">${esc(b.label)}</div>${b.cards.map(c => `<div class="src"><b>${esc(c.title || c.id)}</b> — ${esc((c.text || '').slice(0, 280))}… ${link(c.reference_url, '↗')}</div>`).join('')}</div>`;
  return '';
}
function sources(list) {
  if (!list || !list.length) return '';
  return `<div class="card"><div class="kind">${esc(T().sources)}</div>` + list.map(s =>
    `<div class="src" id="src-${s.n}">[${s.n}] <span class="badge">${esc(s.type)}</span><b>${esc(s.title || s.id)}</b> · ${esc(s.source)}${s.grade ? ` · <span class="badge grade">${esc(String(s.grade).slice(0, 60))}</span>` : ''} · ${link(s.reference_url, '↗')}${s.source === 'hadeethenc' ? ' · HadeethEnc.com' : ''}</div>`).join('') + '</div>';
}
function referrals(list) {
  if (!list || !list.length) return '';
  return `<div class="card"><div class="kind">${esc(T().referrals)}</div><ul class="links">` + list.map(r => `<li>${link(r.url, r.name)}</li>`).join('') + '</ul></div>';
}
function renderAsk(d) {
  let h = '';
  const cls = d.status === 'abstained' ? 'abst' : d.status === 'referral' ? 'ref' : 'warn';
  if (T().st[d.status]) h += `<div class="status ${cls}">${esc(T().st[d.status])}</div>`;
  h += (d.blocks || []).map(block).join('');
  h += sources(d.sources) + referrals(d.referrals);
  h += `<div class="meta">${esc(d.ai_disclosure)}${d.level ? ` · ${esc(d.level)}` : ''}</div>`;
  return h;
}
function claimCard(c) {
  const t = T(); let v = t.verdicts[c.verdict] || c.verdict; if (c.claim_type !== 'verse' && c.verdict === 'fabricated') v = t.hadithFab;
  const mark = c.color === 'green' ? '✔' : c.color === 'red' ? '✖' : c.color === 'amber' ? '⚠' : '?';
  let h = `<div class="card res ${esc(c.color)}"><div class="verdict">${mark} ${esc(v)} <span class="badge">${esc(t.types[c.claim_type] || c.claim_type)}</span></div>
    <span class="label">${esc(t.claim)}</span><div class="claimtxt">${esc(c.claim)}</div><div class="meta">${esc(c.note || '')}</div>`;
  if (c.match && (c.verdict === 'verified' || c.verdict === 'misquoted')) {
    h += `<span class="label">${esc(t.correct)} — ${esc(c.match.surah_name_ar)} ${esc(c.match.ref)}</span><div class="ayah">﴿${esc(c.match.text_ar)}﴾</div>`;
    if (c.diff && c.diff.length) h += `<div class="diff claimtxt">${diffHtml(c.diff)}</div>`;
    h += `<div class="meta">${link(c.match.reference_url, '↗ ' + c.match.ref)}</div>${audioBtn(c.match.ref)}`;
  }
  if (c.correct) {
    h += `<div class="correctbox"><span class="label" style="margin-top:0">${esc(t.correctHadith)}</span><div class="htext big">«${esc(c.correct.text_ar)}»</div>
      <div class="meta"><span class="badge grade">${esc(t.grade)}: ${esc(c.correct.grade)}</span>${esc(c.correct.book || '')} · ${esc(c.correct.source === 'hadeethenc' ? 'HadeethEnc.com' : 'Dorar')} · ${link(c.correct.reference_url, '↗')}</div>`;
    if (c.diff && c.diff.length) h += `<span class="label">${esc(t.whatDiffers)}</span><div class="diff claimtxt">${diffHtml(c.diff)}</div>`;
    h += `</div>`;
  }
  if (c.matches && c.matches.length) {
    h += `<div class="tbl"><table class="m"><tr><th>${esc(t.gradeCol)}</th><th>${esc(t.grader)}</th><th>${esc(t.book)}</th><th></th></tr>` +
      c.matches.map(m => `<tr><td>${esc((m.grade || '').slice(0, 140))}</td><td>${esc(m.grader || '')}</td><td>${esc(m.book || '')} ${esc(m.reference ? String(m.reference).split('\n')[0] : '')}</td><td>${link(m.reference_url, m.source)}</td></tr>`).join('') + '</table></div>';
  }
  return h + '</div>';
}
function renderVerify(d) {
  if (!d.claims || !d.claims.length) return `<div class="status abst">${esc(T().none)}</div>`;
  return d.claims.map(claimCard).join('') + `<div class="meta">${esc(d.ai_disclosure || '')}</div>`;
}

/* ---------------- opt-in problem report (saved ONLY with explicit consent; see core/reports.py) ---------------- */
let lastCtx = null;
function outcomeFrom(d) {
  if (d.status === 'verified' && d.verify) {
    return { status: 'verified', intent: 'verify', language: L, level: d.level, source_ids: [],
             answer_text: (d.verify.claims || []).map(c => c.claim_type + ':' + c.verdict + ' ' + String(c.claim).slice(0, 80)).join(' | ') };
  }
  if (d.claims) return { status: 'verified', intent: 'verify', language: L, source_ids: [], answer_text: d.claims.map(c => c.claim_type + ':' + c.verdict).join(' | ') };
  return { status: d.status, level: d.level, intent: d.intent, language: d.language, abstain_reason: d.abstain_reason,
           answer_text: d.answer_text, source_ids: (d.sources || []).map(s => s.id) };
}
function reportHtml() {
  const t = T();
  return `<details class="reportbox"><summary>${esc(t.reportSummary)}</summary>
    <label class="label" for="rp-reason">${esc(t.reportReason)}</label>
    <select id="rp-reason">${Object.entries(t.reportReasons).map(([k, v]) => `<option value="${k}">${esc(v)}</option>`).join('')}</select>
    <label class="label" for="rp-comment">${esc(t.reportComment)}</label>
    <textarea id="rp-comment" maxlength="500" rows="2"></textarea>
    <label class="consent"><input type="checkbox" id="rp-consent"> <span>${esc(t.reportConsent)}</span></label>
    <div class="row" style="gap:10px"><button class="small-btn" id="rp-send" type="button" disabled>${esc(t.reportSend)}</button><span class="meta" id="rp-msg" style="margin:0"></span></div></details>`;
}
function wireReport() {
  const box = document.querySelector('.reportbox'); if (!box) return;
  const cb = $('#rp-consent'), send = $('#rp-send');
  cb.onchange = () => { send.disabled = !cb.checked; };
  send.onclick = async () => {
    if (!cb.checked || !lastCtx) return;
    send.disabled = true;
    try {
      const r = await fetch('/api/report', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question: lastCtx.question, reason: $('#rp-reason').value, comment: $('#rp-comment').value || null, consent: true, outcome: lastCtx.outcome }) });
      if (!r.ok) throw new Error(r.status);
      $('#rp-msg').textContent = T().reportThanks; cb.disabled = true;
    } catch (e) { $('#rp-msg').textContent = T().reportErr; send.disabled = false; }
  };
}

/* ---------------- calls ---------------- */
function hideFeatures(h) { $('#features').hidden = h; }
function head(text) {
  return `<div class="res-head"><div class="q">${esc(text.length > 160 ? text.slice(0, 160) + '…' : text)}</div><button class="pill" type="button" id="newQ">${esc(T().newQ)}</button></div>`;
}
document.addEventListener('click', e => {
  if (e.target.closest('#newQ')) { $('#out').innerHTML = ''; hideFeatures(false); $('#q').value = ''; growQ(); window.scrollTo({ top: 0, behavior: 'smooth' }); $('#q').focus(); }
});
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function runJob(kind, body) {
  const r = await fetch('/api/jobs', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ kind, text: body.question || body.text, language: body.language || null }) });
  if (r.status === 429) throw new Error('rate');
  if (r.status === 503) throw new Error('busy');
  if (!r.ok) throw new Error('err');
  const { job } = await r.json();
  const t0 = Date.now();
  while (Date.now() - t0 < 300000) {
    await sleep(1500);
    const s = await fetch('/api/jobs/' + job);
    if (s.status === 404) throw new Error('restarted');
    if (!s.ok) throw new Error('err');
    const d = await s.json();
    if (d.state === 'done') return d.result;
    if (d.state === 'error') throw new Error(d.error === 'busy' ? 'busy' : 'err');
    const el = document.getElementById('loadtxt');
    if (el) el.textContent = d.position > 0 ? T().queued.replace('{n}', d.position).replace('{s}', d.est_wait_s) : T().loading;
  }
  throw new Error('timeout');
}
async function call(url, body, btn, kind) {
  const text = body.question || body.text;
  $('#go').disabled = true;
  hideFeatures(true);
  $('#out').innerHTML = head(text) + loading();
  $('#out').scrollIntoView({ behavior: 'smooth', block: 'start' });
  try {
    const d = await runJob(kind, body);
    const html = (d.status === 'verified' && d.verify) ? renderVerify({ ...d.verify, ai_disclosure: d.ai_disclosure })
               : d.claims ? renderVerify(d) : renderAsk(d);
    lastCtx = { question: text, outcome: outcomeFrom(d) };
    $('#out').innerHTML = head(text) + html + reportHtml(); wireReport();
    HISTORY.push({ kind, text, time: new Date().toLocaleTimeString(L === 'ar' ? 'ar' : 'en', { hour: '2-digit', minute: '2-digit' }), html: head(text) + html + reportHtml(), ctx: lastCtx });
  } catch (e) {
    const m = ['rate', 'busy', 'timeout', 'restarted'].includes(e.message) ? T()[e.message] : T().err;
    $('#out').innerHTML = head(text) + `<div class="status warn">${esc(m)}</div>`;
  }
  $('#go').disabled = false;
}
let MODE = 'ask';
function growQ() { const t = $('#q'); t.style.height = ''; const h = Math.min(t.scrollHeight + 2, 240); t.style.height = h + 'px'; t.style.overflowY = t.scrollHeight + 2 > 240 ? 'auto' : 'hidden'; }
function setMode(m) {
  MODE = m; $('.composer').dataset.mode = m;
  $$('.ctab').forEach(b => b.setAttribute('aria-selected', String(b.dataset.mode === m)));
  const q = $('#q'); q.dataset.ip = m === 'ask' ? 'askPh' : 'verifyPh'; q.placeholder = T()[q.dataset.ip];
  const h = $('.chint'); h.dataset.i = m === 'ask' ? 'askHint' : 'verifyHint'; h.textContent = T()[h.dataset.i];
  const g = $('#go'); g.dataset.al = m === 'ask' ? 'send' : 'verify'; g.setAttribute('aria-label', T()[g.dataset.al]);
}
$$('.ctab').forEach(b => b.onclick = () => { setMode(b.dataset.mode); $('#q').focus(); });
$('#go').onclick = () => {
  const q = $('#q').value.trim(); if (!q) return $('#q').focus();
  if (MODE === 'verify') call('/api/verify', { text: q }, $('#go'), 'verify');
  else call('/api/ask', { question: q }, $('#go'), 'ask');
};
$('#q').addEventListener('input', growQ);
$('#q').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('#go').click(); } });
setMode('ask');
const pre = new URLSearchParams(location.search).get('q'); if (pre) $('#q').value = pre;
// ---- ask by voice: record, resample to 16 kHz mono in the browser, server returns text for the box (never auto-submitted)
(() => {
  const mic = $('#mic'), msg = $('#micMsg');
  if (!mic || !navigator.mediaDevices || !window.MediaRecorder) return;
  mic.hidden = false;
  let rec = null, chunks = [], timer = null;
  const stop = () => { clearTimeout(timer); if (rec && rec.state === 'recording') rec.stop(); };
  async function toPcm16(blob) {
    const ctx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
    try {
      const buf = await ctx.decodeAudioData(await blob.arrayBuffer());
      const f = buf.getChannelData(0), out = new Int16Array(f.length);
      for (let i = 0; i < f.length; i++) out[i] = Math.max(-1, Math.min(1, f[i])) * 32767;
      return out.buffer;
    } finally { ctx.close(); }
  }
  async function send(blob) {
    mic.disabled = true; msg.textContent = T().micWork;
    try {
      const r = await fetch('/api/transcribe?language=' + L, { method: 'POST', headers: { 'Content-Type': 'application/octet-stream' }, body: await toPcm16(blob) });
      if (!r.ok) throw new Error(r.status);
      const { text } = await r.json();
      const q = $('#q'); q.value = (q.value.trim() ? q.value.trim() + ' ' : '') + text; q.focus(); q.dispatchEvent(new Event('input'));
      msg.textContent = T().micDone;
    } catch (e) { msg.textContent = T().micErr; }
    mic.disabled = false;
  }
  mic.onclick = async () => {
    if (rec && rec.state === 'recording') return stop();
    let stream;
    try { stream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true } }); }
    catch (e) { msg.textContent = T().micDenied; return; }
    chunks = []; rec = new MediaRecorder(stream);
    rec.ondataavailable = e => chunks.push(e.data);
    rec.onstop = () => { stream.getTracks().forEach(t => t.stop()); mic.classList.remove('rec'); mic.title = T().micStart; const b = new Blob(chunks, { type: rec.mimeType }); chunks = []; send(b); };
    rec.start(); mic.classList.add('rec'); mic.title = T().micStop; msg.textContent = T().micRec;
    timer = setTimeout(stop, 29000);  // one Whisper window is 30 s
  };
})();
applyLang();
(() => { const lg = $('aside .logo').cloneNode(true); lg.classList.remove('logo'); lg.classList.add('tb-logo'); lg.setAttribute('aria-hidden', 'true'); $('.topbar').appendChild(lg); })();
$('#sideHide').onclick = () => { setSide(true); $('#sideShow').focus(); };
$('#sideShow').onclick = () => { setSide(false); $('#sideHide').focus(); };
try { if (localStorage.getItem('bs-side') === '0') $('.app').classList.add('side-off'); } catch (e) {}
matchMedia('(min-width:1001px)').addEventListener('change', paintSide);
paintSide();
$('#fzDown').onclick = () => setFz(fzI - 1);
$('#fzUp').onclick = () => setFz(fzI + 1);
setFz(fzI);
</script>
